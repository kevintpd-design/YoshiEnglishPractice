<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidAI Learning Buddy - 試算表同步版</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #FF6B6B; --secondary: #4ECDC4; --yellow: #FFE66D; --purple: #6C5CE7; --dark: #2D3436; --bg: #F7F9FC; --radius: 20px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', 'Noto Sans TC', sans-serif; user-select: none; }
        body { background-color: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .phone-container { width: 390px; height: 812px; background-color: var(--bg); border-radius: 45px; box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 0 8px #2d3436; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .notch { width: 160px; height: 28px; background-color: #2d3436; position: absolute; top: 0; left: 50%; transform: translateX(-50%); border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; z-index: 100; }
        .app-header { padding: 40px 20px 15px; background: linear-gradient(135deg, var(--purple), #a29bfe); color: white; display: flex; justify-content: space-between; align-items: center; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; z-index: 10; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 42px; height: 42px; background-color: var(--yellow); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid white; }
        .user-details h3 { font-size: 16px; font-weight: 700; }
        .user-details p { font-size: 12px; opacity: 0.9; }
        .coins { background-color: rgba(255,255,255,0.25); padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 14px; }
        .content-area { flex: 1; overflow-y: auto; padding: 20px; position: relative; }
        .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 6px 0 #d63031; transition: all 0.1s; display: inline-block; text-align: center; width: 100%; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d63031; }
        .quiz-card { background: white; border-radius: var(--radius); padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .tag-challenge { display: inline-block; background: #a29bfe; color: white; font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 700; margin-bottom: 8px; }
        .question-text { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 15px; line-height: 1.4; }
        .option-btn { background: #f1f2f6; border: 2px solid #dfe4ea; border-radius: 15px; padding: 12px 15px; margin-bottom: 10px; width: 100%; text-align: left; font-size: 15px; font-weight: 600; cursor: pointer; }
        .option-btn.selected { background: #e8f8f5; border-color: var(--secondary); color: #00b894; }
        .option-btn.wrong { background: #ffe0e0; border-color: var(--primary); color: var(--primary); }
        .progress-bar { height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: var(--secondary); width: 0%; transition: width 0.3s; }
        .mic-btn-container { display: flex; flex-direction: column; align-items: center; margin: 20px 0 10px; }
        .mic-btn { width: 75px; height: 75px; border-radius: 50%; background: linear-gradient(135deg, var(--purple), #a29bfe); border: none; color: white; font-size: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4); }
        .mic-btn.recording { background: var(--primary); animation: pulse-red 1.2s infinite; }
        @keyframes pulse-red { 0% { transform: scale(0.95); } 70% { transform: scale(1.08); } 100% { transform: scale(0.95); } }
        .speech-recognized-text { margin-top: 12px; padding: 10px 14px; background: #f8f9fa; border-radius: 12px; border: 1px dashed #b2bec3; font-size: 13px; color: var(--dark); min-height: 42px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="notch"></div>

        <div class="app-header">
            <div class="user-info">
                <div class="avatar">🐱</div>
                <div class="user-details">
                    <h3>Yoshi (9歲)</h3>
                    <p>連續學習 5 天 🔥</p>
                </div>
            </div>
            <div class="coins">⭐ <span id="star-count">120</span></div>
        </div>

        <div class="content-area">

            <!-- HOME -->
            <div id="screen-home" class="screen active" style="text-align: center; padding-top: 50px;">
                <div style="font-size: 60px; margin-bottom: 15px;">📚</div>
                <h2 style="color:var(--dark); margin-bottom: 10px;">今日課後英語複習</h2>
                <p style="color:#636e72; font-size: 13px; margin-bottom: 30px;">自動同步雲端 Google 試算表最新題庫</p>
                <button class="btn" onclick="loadQuizFromGAS()">🚀 開始今日關卡</button>
            </div>

            <!-- LOADING -->
            <div id="screen-loading" class="screen" style="text-align:center; padding-top:100px;">
                <h3 style="color:var(--dark);">正在連線至 Google 雲端載入題目...</h3>
            </div>

            <!-- QUIZ -->
            <div id="screen-quiz" class="screen">
                <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
                <div id="quiz-container"></div>
            </div>

            <!-- RESULT -->
            <div id="screen-result" class="screen" style="text-align:center; padding-top: 30px;">
                <div style="font-size: 70px;">🎉</div>
                <h2 style="color:var(--dark); margin-top:10px;">太棒了！複習完成！</h2>
                <p style="color:#636e72; margin: 10px 0 20px;">獲得 <b style="color:#f1c40f;">+70 顆星星</b>！</p>
                <button class="btn" onclick="showScreen('screen-home')">回到首頁</button>
            </div>

        </div>
    </div>

    <script>
        // ⭐️ 請將下方替換為您部署後取得的 GAS Web App URL
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbycctRbMI_gafsxA6MSGvnRqFdZo8_aSdZBSoyqZV1qgGNGAxMhqwr-WTxKHm2oWIhr/exec?action=read";

        let currentQuizIndex = 0;
        let stars = 120;
        let dynamicQuizzes = [];

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        async function loadQuizFromGAS() {
            showScreen('screen-loading');
            try {
                const res = await fetch(GAS_API_URL);
                dynamicQuizzes = await res.json();
                
                if (!dynamicQuizzes || dynamicQuizzes.length === 0) {
                    throw new Error("試算表中無可用題目");
                }
            } catch (e) {
                console.warn("讀取雲端試算表失敗，切換至備用題目:", e);
                dynamicQuizzes = getFallbackQuizzes();
            }

            currentQuizIndex = 0;
            showScreen('screen-quiz');
            renderQuestion();
        }

        function getFallbackQuizzes() {
            return [
                {
                    type: "voice",
                    category: "【課堂核心 · 語音對話】",
                    q: "1. 🎙️ 老師指著橡皮擦問：<i>“What is that?”</i><br>請說：<b>「It is an eraser.」</b>",
                    icon: "🧽",
                    exactKeywords: ["eraser", "erazer"],
                    audioPrompt: "It is an eraser.",
                    hint: "💡 賓果！答對了！"
                },
                {
                    type: "choice",
                    category: "【課堂核心 · 文法題】",
                    q: "2. 桌上有 3 支原子筆，應該用哪一個句子？",
                    options: ["They are pens.", "It is a pen.", "They are a pens."],
                    ans: 0,
                    hint: "💡 太棒了！複數 (pens) 前面不可以加 a 或 an 喔！"
                }
            ];
        }

        function renderQuestion() {
            const q = dynamicQuizzes[currentQuizIndex];
            const progress = ((currentQuizIndex + 1) / dynamicQuizzes.length) * 100;
            document.getElementById('progress').style.width = progress + '%';

            let html = `<div class="quiz-card"><span class="tag-challenge">${q.category}</span><div class="question-text">${q.q}</div>`;

            if (q.type === "choice") {
                q.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" onclick="checkChoiceAnswer(this, ${idx})">${opt}</button>`;
                });
            } else if (q.type === "voice") {
                html += `
                    <div style="text-align:center;">
                        <div style="font-size: 45px; margin: 8px 0;">🎙️</div>
                        <div class="mic-btn-container">
                            <button id="mic-button" class="mic-btn" onclick="handleSmartMicClick()">🎙️</button>
                        </div>
                        <div id="speech-result" class="speech-recognized-text">按下麥克風大聲唸出英文...</div>
                    </div>
                `;
            }

            html += `<div id="quiz-feedback" style="margin-top:12px; font-size:13px; font-weight:bold; display:none; text-align:center;"></div></div>`;
            document.getElementById('quiz-container').innerHTML = html;
        }

        function checkChoiceAnswer(btn, selectedIdx) {
            const q = dynamicQuizzes[currentQuizIndex];
            const feedback = document.getElementById('quiz-feedback');
            
            if (selectedIdx === q.ans) {
                btn.classList.add('selected');
                feedback.style.color = "#00b894";
                feedback.innerHTML = "🎉 回答正確！ " + q.hint;
                feedback.style.display = "block";

                setTimeout(() => {
                    currentQuizIndex++;
                    if (currentQuizIndex < dynamicQuizzes.length) renderQuestion();
                    else finishQuiz();
                }, 1500);
            } else {
                btn.classList.add('wrong');
                feedback.style.color = "#d63031";
                feedback.innerText = "❌ 再試一次看看哦！";
                feedback.style.display = "block";
            }
        }

        function handleSmartMicClick() {
            const micBtn = document.getElementById('mic-button');
            const textResult = document.getElementById('speech-result');
            const feedback = document.getElementById('quiz-feedback');

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                textResult.innerText = "⚠️ 您的瀏覽器不支援 Web Speech API，請使用 Chrome 開啟。";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            micBtn.classList.add('recording');
            textResult.innerText = "🎧 正在聆聽中...";

            recognition.start();

            recognition.onresult = function(e) {
                micBtn.classList.remove('recording');
                const spokenText = e.results[0][0].transcript.toLowerCase().trim();
                const q = dynamicQuizzes[currentQuizIndex];

                const isExact = q.exactKeywords ? q.exactKeywords.some(kw => spokenText.includes(kw)) : false;

                if (isExact || spokenText.length > 0) {
                    textResult.innerHTML = `辨識結果：<b>"${spokenText}"</b>`;
                    feedback.style.color = "#00b894";
                    feedback.innerHTML = "🎉 通關！" + q.hint;
                    feedback.style.display = "block";

                    setTimeout(() => {
                        currentQuizIndex++;
                        if (currentQuizIndex < dynamicQuizzes.length) renderQuestion();
                        else finishQuiz();
                    }, 1800);
                }
            };

            recognition.onerror = function() {
                micBtn.classList.remove('recording');
                textResult.innerText = "⚠️ 沒聽清楚，請再試一次！";
            };
        }

        function finishQuiz() {
            stars += 70;
            document.getElementById('star-count').innerText = stars;
            confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
            showScreen('screen-result');
        }
    </script>
</body>
</html>
