<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidAI Learning Buddy - 動態 AI 命題版</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #FF6B6B;
            --primary-light: #FF8E8E;
            --secondary: #4ECDC4;
            --yellow: #FFE66D;
            --purple: #6C5CE7;
            --dark: #2D3436;
            --bg: #F7F9FC;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', 'Noto Sans TC', sans-serif; user-select: none; }
        body { background-color: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .phone-container {
            width: 390px; height: 812px; background-color: var(--bg); border-radius: 45px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 0 8px #2d3436;
            position: relative; overflow: hidden; display: flex; flex-direction: column;
        }

        .notch {
            width: 160px; height: 28px; background-color: #2d3436; position: absolute;
            top: 0; left: 50%; transform: translateX(-50%); border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; z-index: 100;
        }

        .app-header {
            padding: 40px 20px 15px; background: linear-gradient(135deg, var(--purple), #a29bfe);
            color: white; display: flex; justify-content: space-between; align-items: center;
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; z-index: 10;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 42px; height: 42px; background-color: var(--yellow); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid white; }
        .user-details h3 { font-size: 16px; font-weight: 700; }
        .user-details p { font-size: 12px; opacity: 0.9; }
        .coins { background-color: rgba(255,255,255,0.25); padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 14px; }

        .content-area { flex: 1; overflow-y: auto; padding: 20px; position: relative; }
        .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .api-key-box {
            background: #fff; border-radius: 15px; padding: 12px; margin-bottom: 15px;
            border: 1px solid #dcdde1; font-size: 12px;
        }
        .api-key-box input {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px; font-size: 12px;
        }

        .upload-card {
            background: white; border: 3px dashed #b2bec3; border-radius: var(--radius);
            padding: 25px 20px; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 20px;
        }
        .upload-card:hover { border-color: var(--purple); background-color: #f8f7ff; }

        .btn {
            background-color: var(--primary); color: white; border: none; padding: 12px 24px;
            border-radius: 30px; font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 6px 0 #d63031; transition: all 0.1s; display: inline-block; text-align: center; width: 100%;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d63031; }
        .btn-secondary { background-color: var(--secondary); box-shadow: 0 6px 0 #00b894; }

        .section-title { font-size: 18px; color: var(--dark); margin: 15px 0 10px; font-weight: 700; }
        .class-card {
            background: white; border-radius: var(--radius); padding: 15px; margin-bottom: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px; cursor: pointer;
        }

        .loading-box { text-align: center; padding: 50px 20px; }
        .spinner { width: 60px; height: 60px; border: 6px solid #f3f3f3; border-top: 6px solid var(--purple); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .quiz-card { background: white; border-radius: var(--radius); padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .tag-challenge { display: inline-block; background: #a29bfe; color: white; font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 700; margin-bottom: 8px; }
        .question-text { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 15px; line-height: 1.4; }

        .option-btn {
            background: #f1f2f6; border: 2px solid #dfe4ea; border-radius: 15px; padding: 12px 15px;
            margin-bottom: 10px; width: 100%; text-align: left; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .option-btn.selected { background: #e8f8f5; border-color: var(--secondary); color: #00b894; }
        .option-btn.wrong { background: #ffe0e0; border-color: var(--primary); color: var(--primary); }

        .progress-bar { height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: var(--secondary); width: 0%; transition: width 0.3s; }

        .mic-btn-container { display: flex; flex-direction: column; align-items: center; margin: 20px 0 10px; }
        .mic-btn {
            width: 75px; height: 75px; border-radius: 50%; background: linear-gradient(135deg, var(--purple), #a29bfe);
            border: none; color: white; font-size: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .mic-btn.recording { background: var(--primary); animation: pulse-red 1.2s infinite; }
        @keyframes pulse-red { 0% { transform: scale(0.95); } 70% { transform: scale(1.08); } 100% { transform: scale(0.95); } }

        .speech-recognized-text {
            margin-top: 12px; padding: 10px 14px; background: #f8f9fa; border-radius: 12px;
            border: 1px dashed #b2bec3; font-size: 13px; color: var(--dark); min-height: 42px;
            display: flex; align-items: center; justify-content: center;
        }

        .bottom-nav { height: 70px; background: white; border-top: 1px solid #f1f2f6; display: flex; justify-content: space-around; align-items: center; padding-bottom: 10px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #a4b0be; cursor: pointer; }
        .nav-item.active { color: var(--purple); font-weight: 700; }
        #video-upload { display: none; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="notch"></div>

        <div class="app-header">
            <div class="user-info">
                <div class="avatar">🐱</div>
                <div class="user-details">
                    <h3>Yoshi (9歲)</h3>
                    <p>連續學習 5 天 🔥</p>
                </div>
            </div>
            <div class="coins">⭐ <span id="star-count">120</span></div>
        </div>

        <div class="content-area">

            <!-- HOME -->
            <div id="screen-home" class="screen active">
                <div class="api-key-box">
                    <label><b>🔑 Gemini API Key（選填，填入可啟用真實 AI 動態命題）：</b></label>
                    <input type="password" id="gemini-api-key" placeholder="貼上 AIzaSy... API Key">
                </div>

                <div class="upload-card" onclick="triggerUpload()">
                    <div style="font-size:40px; margin-bottom:5px;">📹</div>
                    <h3 style="font-size:15px; color:var(--dark);">上傳新影片生成新題庫</h3>
                    <p style="font-size:11px; color:#a4b0be; margin-bottom:10px;">支援 MP4, MOV (自動生成新關卡)</p>
                    <button class="btn" style="width: auto; padding: 6px 16px; font-size:12px;">選擇影片</button>
                    <input type="file" id="video-upload" accept="video/*" onchange="startProcessing()">
                </div>

                <div class="section-title">📚 選擇複習主題</div>

                <div class="class-card" onclick="startGeneratedQuiz('pens')">
                    <div style="font-size:28px;">🎙️</div>
                    <div>
                        <h4 style="font-size:15px; color:var(--dark);">Pens and Erasers (文法對話)</h4>
                        <p style="font-size:11px; color:#636e72;">上傳時間：今天 15:30</p>
                    </div>
                </div>

                <div class="class-card" onclick="startGeneratedQuiz('animals')">
                    <div style="font-size:28px;">🦁</div>
                    <div>
                        <h4 style="font-size:15px; color:var(--dark);">Zoo Animals (延伸動物篇)</h4>
                        <p style="font-size:11px; color:#636e72;">動態生成主題 2</p>
                    </div>
                </div>
            </div>

            <!-- LOADING -->
            <div id="screen-loading" class="screen">
                <div class="loading-box">
                    <div class="spinner"></div>
                    <h3 style="color:var(--dark); margin-bottom:10px;">AI 正在分析並生成新題目...</h3>
                    <p id="loading-status" style="font-size:13px; color:#636e72;">[1/3] 正在發送 Prompt 給 Gemini API...</p>
                </div>
            </div>

            <!-- QUIZ -->
            <div id="screen-quiz" class="screen">
                <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
                <div id="quiz-container"></div>
            </div>

            <!-- RESULT -->
            <div id="screen-result" class="screen" style="text-align:center; padding-top: 15px;">
                <div style="font-size: 60px;">🎉</div>
                <h2>太棒了！動態關卡通關！</h2>
                <p style="color:#636e72; margin: 10px 0 20px;">獲得 <b style="color:#f1c40f;">+70 顆星星</b>！</p>
                <button class="btn btn-secondary" onclick="showScreen('screen-home')">回到首頁</button>
            </div>

        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab(this, 'screen-home')"><div>🏠</div><span>首頁複習</span></div>
            <div class="nav-item" onclick="switchTab(this, 'screen-quiz')"><div>🎮</div><span>每日闖關</span></div>
        </div>
    </div>

    <script>
        let currentQuizIndex = 0;
        let stars = 120;
        let activeRecognition = null;
        let dynamicQuizzes = [];

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function switchTab(el, screenId) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            showScreen(screenId);
        }

        function triggerUpload() { document.getElementById('video-upload').click(); }

        async function startProcessing() {
            showScreen('screen-loading');
            const status = document.getElementById('loading-status');
            const apiKey = document.getElementById('gemini-api-key').value.trim();

            if (apiKey) {
                status.innerText = "[1/2] 連線至 Gemini API 生成動態題目...";
                try {
                    dynamicQuizzes = await fetchQuizzesFromGemini(apiKey);
                    status.innerText = "[2/2] 題目生成完畢！準備進入關卡...";
                } catch (e) {
                    alert("Gemini API 調用失敗，切換為本地動態生成模式！");
                    dynamicQuizzes = generateLocalFallbackQuizzes('random');
                }
            } else {
                status.innerText = "[1/2] (未填 API Key) 啟用隨機動態出題引擎...";
                await new Promise(r => setTimeout(r, 1500));
                dynamicQuizzes = generateLocalFallbackQuizzes('random');
            }

            setTimeout(() => {
                startQuizEngine();
            }, 1000);
        }

        function startGeneratedQuiz(topic) {
            showScreen('screen-loading');
            document.getElementById('loading-status').innerText = "正在為主題【" + topic + "】動態生成題目...";
            setTimeout(() => {
                dynamicQuizzes = generateLocalFallbackQuizzes(topic);
                startQuizEngine();
            }, 1200);
        }

        function startQuizEngine() {
            currentQuizIndex = 0;
            showScreen('screen-quiz');
            renderQuestion();
        }

        // Call Gemini API to generate dynamic questions
        async function fetchQuizzesFromGemini(apiKey) {
            const prompt = `你是兒童英文教學專家，請生成一份包含 3 道題目的 JSON 格式考題庫：
            1. 第一題為口說題 (type: "voice")，要求唸出特定句子。
            2. 第二題為單字選擇題 (type: "choice")。
            3. 第三題為延伸單字口說題 (type: "voice")。
            請嚴格輸出 JSON 陣列格式：
            [
              {
                "type": "voice",
                "category": "【語音對話關卡】",
                "q": "1. 🎙️ 請問這個是什麼？請唸出：<b>「It is an apple.」</b>",
                "icon": "🍎",
                "exactKeywords": ["apple"],
                "fuzzyKeywords": ["able", "aple"],
                "audioPrompt": "It is an apple.",
                "hint": "答對了！apple 前面用 an 喔！"
              },
              {
                "type": "choice",
                "category": "【文法挑戰】",
                "q": "2. 請問蘋果的複數是哪一個？",
                "options": ["apples", "apple", "an apple"],
                "ans": 0,
                "hint: "太棒了！複數加 s！"
              }
            ]`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await res.json();
            const textResponse = data.candidates[0].content.parts[0].text;
            const cleanJson = textResponse.replace(/```json|```/g, "").trim();
            return JSON.parse(cleanJson);
        }

        // Fallback local dynamic quiz pool generator
        function generateLocalFallbackQuizzes(topic) {
            if (topic === 'animals') {
                return [
                    {
                        type: "voice",
                        category: "【動物篇 · 語音關卡】",
                        q: "1. 🎙️ 看到獅子問你：<i>“What is that?”</i><br>請大聲說出：<b>「It is a lion.」</b>",
                        icon: "🦁",
                        exactKeywords: ["lion"],
                        fuzzyKeywords: ["line", "lionn", "iron"],
                        audioPrompt: "It is a lion.",
                        hint: "💡 賓果！答對了！"
                    },
                    {
                        type: "choice",
                        category: "【動物篇 · 複數題】",
                        q: "2. 動物園有兩隻老虎，句子怎麼寫？",
                        options: ["They are tigers.", "It is a tiger.", "They are tiger."],
                        ans: 0,
                        hint: "💡 賓果！複數是 They are tigers！"
                    }
                ];
            } else {
                return [
                    {
                        type: "voice",
                        category: "【課堂核心 · 語音對話】",
                        q: "1. 🎙️ 老師指著橡皮擦問：<i>“What is that?”</i><br>請說：<b>「It is an eraser.」</b>",
                        icon: "🧽",
                        exactKeywords: ["eraser", "erazer"],
                        fuzzyKeywords: ["racer", "raser", "aser"],
                        audioPrompt: "It is an eraser.",
                        hint: "💡 賓果！答對了！"
                    },
                    {
                        type: "choice",
                        category: "【課堂核心 · 文法題】",
                        q: "2. 桌上有 3 支原子筆，應該用哪一個句子？",
                        options: ["They are pens.", "It is a pen.", "They are a pens."],
                        ans: 0,
                        hint: "💡 太棒了！複數 (pens) 前面不可以加 a 或 an 喔！"
                    },
                    {
                        type: "voice",
                        category: "【課堂核心 · 語音對話】",
                        q: "3. 🎙️ 老師問：<i>“What are these?”</i><br>請說：<b>「They are pens.」</b>",
                        icon: "✏️✏️",
                        exactKeywords: ["pens", "pen"],
                        fuzzyKeywords: ["pants", "pan", "pins", "pin", "pence"],
                        audioPrompt: "They are pens.",
                        hint: "💡 唸得很棒！複數 pens 順利通關！"
                    }
                ];
            }
        }

        function renderQuestion() {
            const q = dynamicQuizzes[currentQuizIndex];
            const progress = ((currentQuizIndex + 1) / dynamicQuizzes.length) * 100;
            document.getElementById('progress').style.width = progress + '%';

            let html = `<div class="quiz-card"><span class="tag-challenge">${q.category}</span><div class="question-text">${q.q}</div>`;

            if (q.type === "choice") {
                q.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" onclick="checkChoiceAnswer(this, ${idx})">${opt}</button>`;
                });
            } else if (q.type === "voice") {
                html += `
                    <div style="text-align:center;">
                        <div style="font-size: 40px; margin: 8px 0;">${q.icon || "✏️"}</div>
                        <div class="mic-btn-container">
                            <button id="mic-button" class="mic-btn" onclick="handleSmartMicClick()">🎙️</button>
                        </div>
                        <div id="speech-result" class="speech-recognized-text">按下麥克風大聲唸出英文...</div>
                    </div>
                `;
            }

            html += `<div id="quiz-feedback" style="margin-top:12px; font-size:13px; font-weight:bold; display:none; text-align:center;"></div></div>`;
            document.getElementById('quiz-container').innerHTML = html;
        }

        function checkChoiceAnswer(btn, selectedIdx) {
            const q = dynamicQuizzes[currentQuizIndex];
            const feedback = document.getElementById('quiz-feedback');
            
            if (selectedIdx === q.ans) {
                btn.classList.add('selected');
                feedback.style.color = "#00b894";
                feedback.innerHTML = "🎉 回答正確！ " + q.hint;
                feedback.style.display = "block";

                setTimeout(() => {
                    currentQuizIndex++;
                    if (currentQuizIndex < dynamicQuizzes.length) renderQuestion();
                    else finishQuiz();
                }, 1500);
            } else {
                btn.classList.add('wrong');
                feedback.style.color = "#d63031";
                feedback.innerText = "❌ 再試一次看看哦！";
                feedback.style.display = "block";
            }
        }

        function handleSmartMicClick() {
            const micBtn = document.getElementById('mic-button');
            const textResult = document.getElementById('speech-result');
            const feedback = document.getElementById('quiz-feedback');

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                textResult.innerText = "⚠️ 您的瀏覽器不支援 Web Speech API，請使用 Chrome 開啟。";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            micBtn.classList.add('recording');
            textResult.innerText = "🎧 正在聆聽中...";

            recognition.start();

            recognition.onresult = function(e) {
                micBtn.classList.remove('recording');
                const spokenText = e.results[0][0].transcript.toLowerCase().trim();
                const q = dynamicQuizzes[currentQuizIndex];

                const isExact = q.exactKeywords ? q.exactKeywords.some(kw => spokenText.includes(kw)) : false;
                const isFuzzy = q.fuzzyKeywords ? q.fuzzyKeywords.some(kw => spokenText.includes(kw)) : false;

                if (isExact || isFuzzy) {
                    textResult.innerHTML = `辨識結果：<b>"${spokenText}"</b>`;
                    feedback.style.color = "#00b894";
                    feedback.innerHTML = "🎉 通關！" + q.hint;
                    feedback.style.display = "block";

                    setTimeout(() => {
                        currentQuizIndex++;
                        if (currentQuizIndex < dynamicQuizzes.length) renderQuestion();
                        else finishQuiz();
                    }, 1800);
                } else {
                    textResult.innerHTML = `聽到的內容：<b>"${spokenText}"</b>`;
                    feedback.style.color = "#d63031";
                    feedback.innerHTML = `💪 請再試一次：<b>${q.audioPrompt}</b>`;
                    feedback.style.display = "block";
                }
            };

            recognition.onerror = function() {
                micBtn.classList.remove('recording');
                textResult.innerText = "⚠️ 沒聽清楚，請再試一次！";
            };
        }

        function finishQuiz() {
            stars += 70;
            document.getElementById('star-count').innerText = stars;
            confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
            showScreen('screen-result');
        }
    </script>
</body>
</html>
